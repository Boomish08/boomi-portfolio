<!DOCTYPE html>
<!--
  ============================================================
  FILE:     index.html  (React / Vite version)
  PURPOSE:  The ONLY HTML page. It is almost empty on purpose:
            React builds every section inside <div id="root">.
            Vite injects our JavaScript through the <script type="module"> line.
  ============================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOOMI. | Boomish V — Aspiring Full-Stack Developer</title>
  <meta name="description" content="Portfolio of Boomish V (BOOMI.), a B.Sc. Computer Technology student and aspiring Full-Stack Developer exploring modern web technologies and Artificial Intelligence." />
  <meta name="author" content="Boomish V" />
  <meta name="theme-color" content="#080808" />

  <!-- Social share preview (used when the link is shared on WhatsApp, LinkedIn, etc.) -->
  <meta property="og:title" content="BOOMI. | Boomish V — Aspiring Full-Stack Developer" />
  <meta property="og:description" content="Less talk. More work. Observe. Learn. Adapt. Build." />
  <meta property="og:type" content="website" />

  <!-- Tiny gold "B" icon for the browser tab, written inline so no extra file is needed -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080808'/%3E%3Crect x='2' y='2' width='60' height='60' rx='12' fill='none' stroke='%23D4AF37' stroke-width='3'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23D4AF37'%3EB%3C/text%3E%3C/svg%3E" />

  <!-- Google Fonts: Cormorant Garamond (premium headlines) + Outfit (clean body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Tells CSS that JavaScript is running (reveal animations only hide things when JS works) -->
  <script>document.documentElement.classList.add("js");</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
